<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
<title id="title">GE-GNN binary-mixture architecture</title>
<desc id="desc">Shared molecular GCN encoders, a hydrogen-bond interaction MPNN, composition-dependent shared MLPs, mean pooling, and automatic differentiation yield log activity coefficients.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#64748b"/></marker></defs>
<rect width="1200" height="590" rx="20" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#0f172a">
<text x="40" y="48" font-size="25" font-weight="700">GE-GNN</text>
<text x="40" y="76" font-size="16" fill="#64748b">Binary-mixture activity coefficients from excess Gibbs energy</text>
<rect x="40" y="130" width="180" height="85" rx="12" fill="#dbeafe" stroke="#cbd5e1"/><text x="130.0" y="159" text-anchor="middle" font-size="17" font-weight="600">Solvent A</text><text x="130.0" y="182" text-anchor="middle" font-size="14" font-weight="400">74 atom features</text><rect x="40" y="280" width="180" height="85" rx="12" fill="#dbeafe" stroke="#cbd5e1"/><text x="130.0" y="309" text-anchor="middle" font-size="17" font-weight="600">Solvent B</text><text x="130.0" y="332" text-anchor="middle" font-size="14" font-weight="400">74 atom features</text><rect x="260" y="130" width="200" height="85" rx="12" fill="#e0e7ff" stroke="#cbd5e1"/><text x="360.0" y="159" text-anchor="middle" font-size="17" font-weight="600">Molecular GCN</text><text x="360.0" y="182" text-anchor="middle" font-size="14" font-weight="400">2 layers + mean readout</text><rect x="260" y="280" width="200" height="85" rx="12" fill="#e0e7ff" stroke="#cbd5e1"/><text x="360.0" y="309" text-anchor="middle" font-size="17" font-weight="600">Molecular GCN</text><text x="360.0" y="332" text-anchor="middle" font-size="14" font-weight="400">shared weights</text><polyline points="220,172 255,172" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><polyline points="220,322 255,322" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="505" y="185" width="195" height="120" rx="12" fill="#ccfbf1" stroke="#cbd5e1"/><text x="602.5" y="214" text-anchor="middle" font-size="17" font-weight="600">Interaction MPNN</text><text x="602.5" y="237" text-anchor="middle" font-size="14" font-weight="400">A ↔ B + self loops</text><text x="602.5" y="260" text-anchor="middle" font-size="14" font-weight="400">hydrogen-bond edges</text><polyline points="460,172 480,172 480,215 500,215" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><polyline points="460,322 480,322 480,275 500,275" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="750" y="130" width="195" height="85" rx="12" fill="#e0e7ff" stroke="#cbd5e1"/><text x="847.5" y="159" text-anchor="middle" font-size="17" font-weight="600">Shared MLP</text><text x="847.5" y="182" text-anchor="middle" font-size="14" font-weight="400">A embedding + x₁</text><rect x="750" y="280" width="195" height="85" rx="12" fill="#e0e7ff" stroke="#cbd5e1"/><text x="847.5" y="309" text-anchor="middle" font-size="17" font-weight="600">Shared MLP</text><text x="847.5" y="332" text-anchor="middle" font-size="14" font-weight="400">B embedding + 1 − x₁</text><polyline points="700,215 725,215 725,172 745,172" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><polyline points="700,275 725,275 725,322 745,322" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="985" y="205" width="175" height="85" rx="12" fill="#fef3c7" stroke="#cbd5e1"/><text x="1072.5" y="234" text-anchor="middle" font-size="17" font-weight="600">Mean + MLP</text><text x="1072.5" y="257" text-anchor="middle" font-size="14" font-weight="400">Excess Gibbs Gᴱ</text><polyline points="945,172 962,172 962,230 980,230" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><polyline points="945,322 962,322 962,268 980,268" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="750" y="430" width="220" height="85" rx="12" fill="#fef3c7" stroke="#cbd5e1"/><text x="860.0" y="459" text-anchor="middle" font-size="17" font-weight="600">Automatic differentiation</text><text x="860.0" y="482" text-anchor="middle" font-size="14" font-weight="400">∂Gᴱ / ∂x₁</text><polyline points="1072,290 1072,395 860,395 860,425" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="420" y="430" width="280" height="85" rx="12" fill="#dcfce7" stroke="#cbd5e1"/><text x="560.0" y="459" text-anchor="middle" font-size="17" font-weight="600">Log activity coefficients</text><text x="560.0" y="482" text-anchor="middle" font-size="14" font-weight="400">ln γ₁ and ln γ₂</text><polyline points="750,472 705,472" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="555" font-size="14" fill="#64748b">Each mixture has its own interaction graph. Shared weights encode both components.</text></g></svg>