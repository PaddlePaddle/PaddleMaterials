Global:
  num_train_timesteps: 1000
  num_inference_steps: 50
  rl_num_inference_steps: 50

Trainer:
  seed: 42
  output_dir: ./output/matinvent_mattergen
  max_epochs: 0
  save_freq: 1
  log_freq: 1
  start_eval_epoch: 1
  eval_freq: 1
  compute_metric_during_train: false

Dataset:
  train: ${Sample.data}

Model:
  __class_name__: MatinventRL
  __init_params__:
    model_type: mattergen
    num_inference_steps: ${Global.num_inference_steps}
    build_structure_cfg:
      format: array
      niggli: False
    rl_cfg:
      pretrained_model_name: matinvent_mattergen_mp20
      rl_epoch: 50
      topk_ratio: 0.5
      save_freq: 10
      sample_cfg:
        batch_size: 1
        num_batches: 2
        num_inference_steps: ${Global.rl_num_inference_steps}
      finetune_cfg:
        batch_size: 4
        epochs: 2
        timesteps: 100
        accum_steps: 4
        sigma: 0.025
        optimizer_cfg:
          __class_name__: Adam
          __init_params__:
            lr: 1.0e-05
      reward_cfg:
        reward_threshold: 0.5
        reduce: mean
        prop_cfg:
          - name: density
            target: ascending
            minv: 0.0
            maxv: 10.0
            calculator:
              __class_name__: PyMatGen
              task: density
      replay_cfg:
        buffer_size: 1000
        sample_size: 32
        reward_cutoff: 0.0
      div_filter_cfg:
        enabled: true
        tol: 10
        buff: 20
        method: composition

Sample:
  data:
    dataset:
      __class_name__: NumAtomsCrystalDataset
      __init_params__:
        total_num: 4
    sampler:
      __class_name__: BatchSampler
      __init_params__:
        shuffle: False
        drop_last: False
        batch_size: 1
  build_structure_cfg: ${Model.__init_params__.build_structure_cfg}
  model_sample_params:
    num_inference_steps: ${Global.num_inference_steps}
