Global:
  # Whether to train, evaluate or test
  do_train: True
  do_eval: False
  do_test: False
  # Diffusion and sampling step budgets
  num_train_timesteps: 1000
  num_inference_steps: 1000
  atom_count_distribution: ALEX_MP_20
  rl_num_inference_steps: 100
  # Structure parser shared by the RL scorer and the sampler
  build_structure_cfg:
    format: array
    niggli: False

  transforms: []
  training_cfg:
    topk_ratio: 0.5
    build_structure_cfg: ${Global.build_structure_cfg}
    transforms: ${Global.transforms}
    sample_cfg:
      data_cfg:
        dataset:
          __class_name__: NumAtomsCrystalDataset
          __init_params__:
            total_num: 16
            dist_name: ${Global.atom_count_distribution}
            prop_names: []
            prop_values: []
        sampler:
          __class_name__: BatchSampler
          __init_params__:
            batch_size: 16
            shuffle: False
            drop_last: False
      num_inference_steps: ${Global.rl_num_inference_steps}
    finetune_cfg:
      batch_size: 4
      epochs: 3
      timesteps: ${Global.num_train_timesteps}
      accum_steps: 50
      sigma: 0.025
    reward_cfg:
      reward_threshold: 0.5
      reduce: mean
      prop_cfg:
        - name: density
          target: ascending
          minv: 0.0
          maxv: 10.0
          calculator:
            __class_name__: PyMatGen
            __init_params__:
              task: density
    anchor_cfg:
      data_cfg:
        dataset:
          __class_name__: MP20Dataset
          __init_params__:
            path: ./data/mp_20/train.csv
            build_structure_cfg:
              format: cif_str
              num_cpus: 10
            cache_path: ./data/mp_20_cache/train
            transforms: ${Global.transforms}
        loader:
          num_workers: 0
          use_shared_memory: False
        sampler:
          __class_name__: BatchSampler
          __init_params__:
            batch_size: 1
            shuffle: False
            drop_last: False
      num_samples: 32
      resample: False
      loss_weight: 1.0
      every_n_steps: 4
    replay_cfg:
      buffer_size: 1000
      sample_size: 32
      reward_cutoff: 0.0
    div_filter_cfg:
      tol: 10
      buff: 20
      method: composition
    early_stop_cfg:
      enabled: False
      probe_num_samples: 4
      probe_every: 1
      probe_every_updates: 1
      probe_draws: 4
      max_loss_ratio: 1.30
      max_lattice_ratio: 1.30
      max_type_ratio: 2.0

Trainer:
  # Random seed
  seed: 42
  # Save path for checkpoints and logs
  output_dir: ./output/matinvent_diffcsp_mp20
  # One epoch is one RL round
  max_epochs: 10
  save_freq: 1
  log_freq: 1
  start_eval_epoch: 1
  eval_freq: 10
  save_freq_steps: null
  eval_freq_steps: null
  pretrained_model_path: http://127.0.0.1/models/matinvent_diffcsp_mp20.zip
  pretrained_weight_name: null
  resume_from_checkpoint: null
  use_amp: False
  amp_level: 'O1'
  eval_with_no_grad: True
  gradient_accumulation_steps: ${Global.training_cfg.finetune_cfg.accum_steps}
  best_metric_indicator: null
  name_for_best_metric: 'loss'
  greater_is_better: False
  compute_metric_during_train: False
  metric_strategy_during_eval: 'step'
  use_visualdl: False
  use_wandb: False
  use_tensorboard: False

Optimizer:
  __class_name__: Adam
  __init_params__:
    beta1: 0.9
    beta2: 0.999
    lr: 1.0e-06

Dataset:
  train:
    dataset:
      __class_name__: MatInventStepDataset
      __init_params__:
        timesteps: ${Global.training_cfg.finetune_cfg.timesteps}
        epochs: ${Global.training_cfg.finetune_cfg.epochs}
        accum_steps: ${Global.training_cfg.finetune_cfg.accum_steps}
    loader:
      num_workers: 0
      use_shared_memory: False
    sampler:
      __class_name__: BatchSampler
      __init_params__:
        shuffle: False
        drop_last: False
        batch_size: 1
  val:
    dataset:
      __class_name__: MP20Dataset
      __init_params__:
        path: ./data/mp_20/val.csv
        build_structure_cfg:
          format: cif_str
          num_cpus: 10
        cache_path: ./data/mp_20_cache/val
        transforms: ${Global.transforms}
    loader:
      num_workers: 0
      use_shared_memory: False
    sampler:
      __class_name__: BatchSampler
      __init_params__:
        shuffle: False
        drop_last: False
        batch_size: 256
  test:
    dataset:
      __class_name__: MP20Dataset
      __init_params__:
        path: ./data/mp_20/test.csv
        build_structure_cfg:
          format: cif_str
          num_cpus: 10
        cache_path: ./data/mp_20_cache/test
        transforms: ${Global.transforms}
    loader:
      num_workers: 0
      use_shared_memory: False
    sampler:
      __class_name__: BatchSampler
      __init_params__:
        shuffle: False
        drop_last: False
        batch_size: 256

Model:
  __class_name__: MatinventDiffCSP
  __init_params__:
    training_cfg: ${Global.training_cfg}
    decoder_cfg:
      hidden_dim: 512
      latent_dim: 256
      num_layers: 6
      act_fn: silu
      dis_emb: sin
      num_freqs: 128
      edge_style: fc
      ln: true
      ip: true
      smooth: false
      pred_type: false
      pred_scalar: false
      num_classes: 100
    lattice_noise_scheduler_cfg:
      __class_name__: MatinventDDPMScheduler
      __init_params__:
        beta_schedule: squaredcos_cap_v2
        beta_clip_min: 1.0e-4
        beta_clip_max: 0.9999
        num_train_timesteps: ${Global.num_train_timesteps}
        clip_sample: false
    coord_noise_scheduler_cfg:
      __class_name__: MatinventSdeVeScheduler
      __init_params__:
        num_train_timesteps: ${Global.num_train_timesteps}
        sigma_min: 0.005
        sigma_max: 0.5
        snr: 1.0e-05
    num_train_timesteps: ${Global.num_train_timesteps}
    time_dim: 256
    lattice_loss_weight: 1
    coord_loss_weight: 1

Sample:
  data:
    dataset:
      __class_name__: MP20Dataset
      __init_params__:
        path: ./data/mp_20/test.csv
        build_structure_cfg:
          format: cif_str
          num_cpus: 10
    sampler:
      __class_name__: BatchSampler
      __init_params__:
        shuffle: False
        drop_last: False
        batch_size: 4
  build_structure_cfg: ${Global.build_structure_cfg}
  model_sample_params:
    num_inference_steps: ${Global.num_inference_steps}
