Global:
  # Whether to train, evaluate or test
  do_train: True
  do_eval: False
  do_test: False
  # Diffusion and sampling step budgets
  num_train_timesteps: 1000
  num_inference_steps: 50
  rl_num_inference_steps: 50
  # Structure parser shared by the RL scorer and the sampler
  build_structure_cfg:
    format: array
    niggli: False

Trainer:
  __class_name__: ppmat.models.matinvent.trainer.MatInventTrainer
  # Random seed
  seed: 42
  # Save path for checkpoints and logs
  output_dir: ./output/matinvent_mattergen_mp20
  # One epoch is one RL round
  max_epochs: 10
  save_freq: 1
  log_freq: 1
  start_eval_epoch: 1
  eval_freq: 10
  save_freq_steps: null
  eval_freq_steps: null
  # Agent/prior weights come from __init_params__.pretrained_model_name
  pretrained_model_path: null
  pretrained_weight_name: null
  resume_from_checkpoint: null
  use_amp: False
  amp_level: 'O1'
  eval_with_no_grad: True
  gradient_accumulation_steps: 1
  best_metric_indicator: null
  name_for_best_metric: 'loss'
  greater_is_better: False
  compute_metric_during_train: False
  metric_strategy_during_eval: 'step'
  use_visualdl: False
  use_wandb: False
  use_tensorboard: False
  __init_params__:
    pretrained_model_name: matinvent_mattergen_mp20
    topk_ratio: 0.5
    build_structure_cfg: ${Global.build_structure_cfg}
    transforms: ${Dataset.train.dataset.__init_params__.transforms}
    sample_cfg:
      batch_size: 16
      num_batches: 1
      num_inference_steps: ${Global.rl_num_inference_steps}
    finetune_cfg:
      batch_size: 4
      epochs: 3
      timesteps: ${Global.num_train_timesteps}
      accum_steps: 50
      sigma: 0.025
    reward_cfg:
      reward_threshold: 0.5
      reduce: mean
      prop_cfg:
        - name: density
          target: ascending
          minv: 0.0
          maxv: 10.0
          calculator:
            __class_name__: PyMatGen
            __init_params__:
              task: density
    anchor_cfg:
      num_samples: 4
      resample: False
      loss_weight: 0.0
      every_n_steps: 1
    replay_cfg:
      buffer_size: 1000
      sample_size: 32
      reward_cutoff: 0.0
    div_filter_cfg:
      tol: 10
      buff: 20
      method: composition
    early_stop_cfg:
      enabled: False
      probe_num_samples: 4
      probe_every: 1
      probe_every_updates: 1
      probe_draws: 4
      max_loss_ratio: 1.30
      max_lattice_ratio: 1.30
      max_type_ratio: 2.0

Optimizer:
  __class_name__: Adam
  __init_params__:
    beta1: 0.9
    beta2: 0.999
    lr: 1.0e-06

Dataset:
  train:
    dataset:
      __class_name__: MP20Dataset
      __init_params__:
        path: ./data/mp_20/train.csv
        build_structure_cfg:
          format: cif_str
          num_cpus: 10
        cache_path: ./data/mp_20_cache/train
        transforms:
          - __class_name__: LatticePolarDecomposition
            __init_params__: {}
    loader:
      num_workers: 0
      use_shared_memory: False
    sampler:
      __class_name__: BatchSampler
      __init_params__:
        shuffle: False
        drop_last: False
        batch_size: 32
  val:
    dataset:
      __class_name__: MP20Dataset
      __init_params__:
        path: ./data/mp_20/val.csv
        build_structure_cfg:
          format: cif_str
          num_cpus: 10
        cache_path: ./data/mp_20_cache/val
        transforms:
          - __class_name__: LatticePolarDecomposition
            __init_params__: {}
    loader:
      num_workers: 0
      use_shared_memory: False
    sampler:
      __class_name__: BatchSampler
      __init_params__:
        shuffle: False
        drop_last: False
        batch_size: 256
  test:
    dataset:
      __class_name__: MP20Dataset
      __init_params__:
        path: ./data/mp_20/test.csv
        build_structure_cfg:
          format: cif_str
          num_cpus: 10
        cache_path: ./data/mp_20_cache/test
        transforms:
          - __class_name__: LatticePolarDecomposition
            __init_params__: {}
    loader:
      num_workers: 0
      use_shared_memory: False
    sampler:
      __class_name__: BatchSampler
      __init_params__:
        shuffle: False
        drop_last: False
        batch_size: 256

Model:
  __class_name__: MatinventMatterGen
  __init_params__:
    decoder_cfg:
      gemnet_cfg:
        num_targets: 1
        latent_dim: 512
        atom_embedding_cfg:
          emb_size: 512
          with_mask_type: true
        max_neighbors: 50
        max_cell_images_per_dim: 5
        cutoff: 7.0
        num_blocks: 4
        otf_graph: true
    lattice_noise_scheduler_cfg:
      __class_name__: LatticeVPSDEScheduler
      __init_params__:
        limit_density: 0.05771451654022283
    coord_noise_scheduler_cfg:
      __class_name__: NumAtomsVarianceAdjustedWrappedVESDE
      __init_params__: {}
    atom_noise_scheduler_cfg:
      __class_name__: D3PMScheduler
      __init_params__: {}
    num_train_timesteps: ${Global.num_train_timesteps}
    max_t: 1.0
    time_dim: 256
    lattice_loss_weight: 1
    coord_loss_weight: 0.1
    atom_loss_weight: 1
    d3pm_hybrid_lambda: 0.01

Sample:
  data:
    dataset:
      __class_name__: NumAtomsCrystalDataset
      __init_params__:
        total_num: 4
        dist_name: ALEX_MP_20
    sampler:
      __class_name__: BatchSampler
      __init_params__:
        shuffle: False
        drop_last: False
        batch_size: 1
  build_structure_cfg: ${Global.build_structure_cfg}
  model_sample_params:
    num_inference_steps: ${Global.num_inference_steps}
