Global:
  # Whether to train, evaluate or test
  do_train: True
  do_eval: False
  do_test: False
  # Diffusion and sampling step budgets
  num_train_timesteps: 1000
  num_inference_steps: 1000
  atom_count_distribution: MP_20
  rl_num_inference_steps: 1000
  # Structure parser shared by the RL scorer and the sampler
  build_structure_cfg:
    format: array
    niggli: False

  transforms: []
  training_cfg:
    topk_ratio: 0.125
    build_structure_cfg: ${Global.build_structure_cfg}
    transforms: ${Global.transforms}
    sample_cfg:
      data_cfg:
        dataset:
          __class_name__: NumAtomsCrystalDataset
          __init_params__:
            total_num: 32
            dist_name: ${Global.atom_count_distribution}
            prop_names: []
            prop_values: []
        sampler:
          __class_name__: BatchSampler
          __init_params__:
            batch_size: 32
            shuffle: False
            drop_last: False
      num_inference_steps: ${Global.rl_num_inference_steps}
      max_num: 16
    finetune_cfg:
      batch_size: 16
      epochs: 3
      timesteps: ${Global.num_train_timesteps}
      accum_steps: 50
      sigma: 0.025
    reward_cfg:
      reward_threshold: 0.8
      reduce: mean
      prop_cfg:
        - name: hhi
          target: descending
          minv: 750
          maxv: 3250
          calculator:
            __class_name__: PyMatGen
            __init_params__:
              task: hhi
    anchor_cfg:
      num_samples: 32
      resample: True
      loss_weight: 4.0
      every_n_steps: 4
    replay_cfg:
      buffer_size: 100
      sample_size: 10
      reward_cutoff: 0.1
    div_filter_cfg:
      tol: 3
      buff: 6
      method: composition
    qualification_cfg:
      reference_path: ./data/matinvent/reference_MP2020correction.gz
      predictor_cfg:
        model_name: mattersim_5M
        weights_name: mattersim-v1.0.0-5M_model.pdparams
        device: gpu:0
      stability_threshold: 0.1
      fmax: 0.05
      max_steps: 1000
    early_stop_cfg:
      enabled: True
      probe_num_samples: 4
      probe_every: 1
      probe_every_updates: 1
      probe_draws: 4
      max_loss_ratio: 1.30
      max_lattice_ratio: 1.30
      max_type_ratio: 2.0

Trainer:
  # Random seed
  seed: 42
  # Save path for checkpoints and logs
  output_dir: ./output/matinvent_diffcsp_mp20_joint
  # One epoch is one RL round
  max_epochs: 3
  save_freq: 1
  log_freq: 1
  start_eval_epoch: 1
  eval_freq: 10
  save_freq_steps: null
  eval_freq_steps: null
  pretrained_model_path: http://127.0.0.1/models/matinvent_diffcsp_mp20_joint.zip
  pretrained_weight_name: null
  resume_from_checkpoint: null
  use_amp: False
  amp_level: 'O1'
  eval_with_no_grad: True
  gradient_accumulation_steps: ${Global.training_cfg.finetune_cfg.accum_steps}
  best_metric_indicator: null
  name_for_best_metric: 'loss'
  greater_is_better: False
  compute_metric_during_train: False
  metric_strategy_during_eval: 'step'
  use_visualdl: False
  use_wandb: False
  use_tensorboard: False

Optimizer:
  __class_name__: Adam
  __init_params__:
    beta1: 0.9
    beta2: 0.999
    lr: 1.0e-05

Dataset:
  train:
    dataset:
      __class_name__: MatInventDataset
      __init_params__:
        finetune_cfg: ${Global.training_cfg.finetune_cfg}
        path: ./data/mp_20/train.csv
        build_structure_cfg:
          format: cif_str
          num_cpus: 10
        cache_path: ./data/mp_20_cache/train
        transforms: ${Global.transforms}
    loader:
      num_workers: 0
      use_shared_memory: False
    sampler:
      __class_name__: BatchSampler
      __init_params__:
        shuffle: False
        drop_last: False
        batch_size: 1
  val:
    dataset:
      __class_name__: MP20Dataset
      __init_params__:
        path: ./data/mp_20/val.csv
        build_structure_cfg:
          format: cif_str
          num_cpus: 10
        cache_path: ./data/mp_20_cache/val
        transforms: ${Global.transforms}
    loader:
      num_workers: 0
      use_shared_memory: False
    sampler:
      __class_name__: BatchSampler
      __init_params__:
        shuffle: False
        drop_last: False
        batch_size: 256
  test:
    dataset:
      __class_name__: MP20Dataset
      __init_params__:
        path: ./data/mp_20/test.csv
        build_structure_cfg:
          format: cif_str
          num_cpus: 10
        cache_path: ./data/mp_20_cache/test
        transforms: ${Global.transforms}
    loader:
      num_workers: 0
      use_shared_memory: False
    sampler:
      __class_name__: BatchSampler
      __init_params__:
        shuffle: False
        drop_last: False
        batch_size: 256

Model:
  __class_name__: MatinventDiffCSP
  __init_params__:
    training_cfg: ${Global.training_cfg}
    decoder_cfg:
      hidden_dim: 512
      latent_dim: 256
      num_layers: 6
      act_fn: silu
      dis_emb: sin
      num_freqs: 128
      edge_style: fc
      ln: true
      ip: true
      smooth: true
      pred_type: true
      pred_scalar: false
      num_classes: 100
    lattice_noise_scheduler_cfg:
      __class_name__: MatinventDDPMScheduler
      __init_params__:
        beta_schedule: squaredcos_cap_v2
        beta_clip_min: 1.0e-4
        beta_clip_max: 0.9999
        num_train_timesteps: ${Global.num_train_timesteps}
        clip_sample: false
    coord_noise_scheduler_cfg:
      __class_name__: MatinventSdeVeScheduler
      __init_params__:
        num_train_timesteps: ${Global.num_train_timesteps}
        sigma_min: 0.005
        sigma_max: 0.5
        snr: 5.0e-06
    atom_noise_scheduler_cfg:
      __class_name__: MatinventDDPMScheduler
      __init_params__:
        beta_schedule: squaredcos_cap_v2
        beta_clip_min: 1.0e-4
        beta_clip_max: 0.9999
        num_train_timesteps: ${Global.num_train_timesteps}
        clip_sample: false
    num_train_timesteps: ${Global.num_train_timesteps}
    time_dim: 256
    lattice_loss_weight: 1
    coord_loss_weight: 1
    atom_loss_weight: 20.0
    time_embedding_offset: 1

Sample:
  data:
    dataset:
      __class_name__: NumAtomsCrystalDataset
      __init_params__:
        total_num: 16
        dist_name: ${Global.atom_count_distribution}
        prop_names: []
        prop_values: []
    sampler:
      __class_name__: BatchSampler
      __init_params__:
        shuffle: False
        drop_last: False
        batch_size: 16
  build_structure_cfg: ${Global.build_structure_cfg}
  model_sample_params:
    num_inference_steps: ${Global.num_inference_steps}
