Model:
  __class_name__: Chemeleon2LDMModule
  __init_params__:
    denoiser:
      __class_name__: Chemeleon2DiT
      __init_params__:
        hidden_dim: 768
        num_layers: 12
        num_heads: 12
        mlp_ratio: 4.0
        input_dim: 8
        learn_sigma: true
    diffusion_configs:
      timestep_respacing: ""
      noise_schedule: linear
      sigma_small: false
      learn_sigma: true
      diffusion_steps: 1000
    vae:
      __class_name__: Chemeleon2VAEModule
      __init_params__:
        encoder:
          __class_name__: Chemeleon2TransformerEncoder
          __init_params__:
            max_num_elements: 100
            d_model: 512
            nhead: 8
            dim_feedforward: 2048
            activation: gelu
            dropout: 0.0
            num_layers: 8
        decoder:
          __class_name__: Chemeleon2TransformerDecoder
          __init_params__:
            max_num_elements: 100
            d_model: 512
            nhead: 8
            dim_feedforward: 2048
            activation: gelu
            dropout: 0.0
            num_layers: 8
        latent_dim: 8
        loss_weights: {}

Sample:
  data:
    dataset:
      __class_name__: NumAtomsCrystalDataset
      __init_params__:
        total_num: 10
    sampler:
      __class_name__: BatchSampler
      __init_params__:
        batch_size: 10
  build_structure_cfg:
    format: array
    niggli: false
  metrics:
    __class_name__: StructGenMetric
    __init_params__:
      reference_file_path: null
