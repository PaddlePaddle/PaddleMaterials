Global:
  do_train: True
  do_eval: True
  do_test: False
  max_num_elements: 100
  latent_dim: 8
  vae_hidden_dim: 512
  vae_num_layers: 8
  vae_num_heads: 8
  vae_feedforward_dim: 2048
  dit_hidden_dim: 768
  dit_num_layers: 12
  dit_num_heads: 12
  num_train_timesteps: 1000
  learn_sigma: True

Trainer:
  max_epochs: 100
  seed: 42
  output_dir: ./output/chemeleon2_ldm
  save_freq: 500
  log_freq: 20
  start_eval_epoch: 1
  eval_freq: 100
  compute_metric_during_train: False
  metric_strategy_during_eval: 'epoch'
  best_metric_indicator: 'eval_loss'
  name_for_best_metric: 'loss'
  greater_is_better: False

Model:
  __class_name__: Chemeleon2
  __init_params__:
    stage: diffusion
    denoiser_cfg:
      __class_name__: Chemeleon2DiT
      __init_params__:
        hidden_dim: ${Global.dit_hidden_dim}
        num_layers: ${Global.dit_num_layers}
        num_heads: ${Global.dit_num_heads}
        mlp_ratio: 4.0
        input_dim: ${Global.latent_dim}
        learn_sigma: ${Global.learn_sigma}
        frequency_embedding_dim: 256
    noise_scheduler_cfg:
      __class_name__: EpsilonDiffusionScheduler
      __init_params__:
        scheduler_cfg:
          __class_name__: DDPMScheduler
          __init_params__:
            num_train_timesteps: ${Global.num_train_timesteps}
            beta_start: 0.0001
            beta_end: 0.02
            beta_schedule: linear
            variance_type: fixed_small
            prediction_type: epsilon
            clip_sample: False
        timestep_respacing: ""
        learn_sigma: ${Global.learn_sigma}
    condition_names: []
    property_embeddings_adapt_cfg: null
    vae_cfg:
      __class_name__: Chemeleon2VAEModule
      __init_params__:
        encoder_cfg:
          __class_name__: Chemeleon2TransformerEncoder
          __init_params__:
            max_num_elements: ${Global.max_num_elements}
            d_model: ${Global.vae_hidden_dim}
            nhead: ${Global.vae_num_heads}
            dim_feedforward: ${Global.vae_feedforward_dim}
            activation: gelu
            dropout: 0.0
            num_layers: ${Global.vae_num_layers}
        decoder_cfg:
          __class_name__: Chemeleon2TransformerDecoder
          __init_params__:
            max_num_elements: ${Global.max_num_elements}
            d_model: ${Global.vae_hidden_dim}
            nhead: ${Global.vae_num_heads}
            dim_feedforward: ${Global.vae_feedforward_dim}
            activation: gelu
            dropout: 0.0
            num_layers: ${Global.vae_num_layers}
        latent_dim: ${Global.latent_dim}
        loss_weights: {}
    vae_ckpt_path: null
    vae_pretrained_model_name: chemeleon2_vae

Optimizer:
  __class_name__: AdamW
  __init_params__:
    lr: 0.0001
    weight_decay: 0.0

Dataset:
  train:
    dataset:
      __class_name__: MP20Dataset
      __init_params__:
        path: "./data/mp_20/train.csv"
        build_structure_cfg:
          format: cif_str
          num_cpus: 10
    loader:
      num_workers: 4
      use_shared_memory: False
    sampler:
      __class_name__: BatchSampler
      __init_params__:
        shuffle: True
        drop_last: True
        batch_size: 32
  val:
    dataset:
      __class_name__: MP20Dataset
      __init_params__:
        path: "./data/mp_20/val.csv"
        build_structure_cfg:
          format: cif_str
          num_cpus: 10
    loader:
      num_workers: 4
      use_shared_memory: False
    sampler:
      __class_name__: BatchSampler
      __init_params__:
        batch_size: 32
  test:
    dataset:
      __class_name__: MP20Dataset
      __init_params__:
        path: "./data/mp_20/test.csv"
        build_structure_cfg:
          format: cif_str
          num_cpus: 10
    loader:
      num_workers: 4
      use_shared_memory: False
    sampler:
      __class_name__: BatchSampler
      __init_params__:
        batch_size: 32

Sample:
  data:
    dataset:
      __class_name__: NumAtomsCrystalDataset
      __init_params__:
        total_num: 10
        prop_names: []
        prop_values: []
    sampler:
      __class_name__: BatchSampler
      __init_params__:
        batch_size: 10
  build_structure_cfg:
    format: array
    niggli: False
  metrics:
    __class_name__: CrystalVUNMetric
    __init_params__:
      reference_file_path: null
  model_sample_params:
    num_inference_steps: 50
