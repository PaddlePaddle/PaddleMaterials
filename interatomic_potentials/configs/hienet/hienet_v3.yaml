        -7.358026027679443, -2.759213447570801, -12.138731002807617, -8.253807067871094,
        -0.029634622856974602, -5.172701835632324, -14.94078540802002, -7.284396648406982,
        -9.629858016967773, -6.961874485015869, -12.265888214111328, -3.7320823669433594,
        -4.883209705352783, -7.562558174133301, -8.015908241271973, -5.300786018371582,
        -15.269716262817383, -2.5620508193969727, -11.380659103393555, -6.856767177581787,
        -7.777291774749756, -4.67112922668457, -3.5867326259613037, -7.904437065124512,
