        -11.847882270812988]
      scale: [0.799, 0.799, 0.799, 0.799, 0.799, 0.799, 0.799, 0.799, 0.799, 0.799, 0.799,
        0.799, 0.799, 0.799, 0.799, 0.799, 0.799, 0.799, 0.799, 0.799, 0.799, 0.799, 0.799,
        0.799, 0.799, 0.799, 0.799, 0.799, 0.799, 0.799, 0.799, 0.799, 0.799, 0.799, 0.799,
        0.799, 0.799, 0.799, 0.799, 0.799, 0.799, 0.799, 0.799, 0.799, 0.799, 0.799, 0.799,
        0.799, 0.799, 0.799, 0.799, 0.799, 0.799, 0.799, 0.799, 0.799, 0.799, 0.799, 0.799,
        0.799, 0.799, 0.799, 0.799, 0.799, 0.799, 0.799, 0.799, 0.799, 0.799, 0.799, 0.799,
        0.799, 0.799, 0.799, 0.799, 0.799, 0.799, 0.799, 0.799, 0.799, 0.799, 0.799, 0.799,
        0.799, 0.799, 0.799, 0.799, 0.799, 0.799]
    loss_type: huber
    huber_loss_delta: 0.01
    loss_weights_dict:
      energy: 1.0
      force: 1.0
      stress: 0.01

Optimizer:
  __class_name__: AdamW
  __init_params__:
    weight_decay: 0.001
    lr:
      __class_name__: Cosine
      __init_params__:
        learning_rate: 0.01
        eta_min: 5e-6
        warmup_epoch: 0
        by_epoch: False

Metric:
  energy:
    __class_name__: IgnoreNanMetricWrapper
    __init_params__:
      __class_name__: paddle.nn.L1Loss
      __init_params__: {}
  force:
    __class_name__: IgnoreNanMetricWrapper
    __init_params__:
      __class_name__: paddle.nn.L1Loss
      __init_params__: {}
  stress:
    __class_name__: HIENetStressVoigtMetric
    __init_params__: {}

Dataset:
  train:
    dataset:
      __class_name__: MPTrjDataset
      __init_params__:
        path: "./data/MPtrj_2022.9_full/train.json"
        # label keys as stored in the split JSON
        property_names: ['uncorrected_total_energy', 'force', 'stress']
        build_structure_cfg:
          format: dict
          num_cpus: 10
        build_graph_cfg: ${Global.graph_converter}
        # kBar -> eV/A^3 (1 / 1602.1766208); sign preserved
        filter_unvalid: False
        transforms:
          - __class_name__: Scale
            __init_params__:
              scale: 0.0006241509125883258
              apply_keys: ['stress']
        # keep the graph cache separate from configs using other converters
        cache_path: "./data/MPtrj_2022.9_full_cache_hienet/train"
    sampler:
      __class_name__: BatchSampler
      __init_params__:
        shuffle: True
        drop_last: True
        batch_size: 48
    loader:
      num_workers: 0
      use_shared_memory: False
  val:
    dataset:
      __class_name__: MPTrjDataset
      __init_params__:
        path: "./data/MPtrj_2022.9_full/val.json"
        property_names: ['uncorrected_total_energy', 'force', 'stress']
        build_structure_cfg:
          format: dict
          num_cpus: 10
        build_graph_cfg: ${Global.graph_converter}
        filter_unvalid: False
        transforms:
          - __class_name__: Scale
            __init_params__:
              scale: 0.0006241509125883258
              apply_keys: ['stress']
        cache_path: "./data/MPtrj_2022.9_full_cache_hienet/val"
    sampler:
      __class_name__: BatchSampler
      __init_params__:
        shuffle: False
        drop_last: False
        batch_size: 48
    loader:
      num_workers: 0
      use_shared_memory: False


Predict:
  graph_converter: ${Global.graph_converter}
  eval_with_no_grad: False
